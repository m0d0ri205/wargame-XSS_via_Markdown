<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game Card</title>
    <style>
        body {
            background-color: black;
            color: rgb(255, 255, 255);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle, rgba(0,0,0,1) 50%, rgba(45,45,45,1) 100%);
        }
        .card {
            width: 300px;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }
        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }
        .card-front {
            background-color: rgb(189, 155, 114);
        }
        .card-back {
            background-color: gray;
            transform: rotateY(180deg);
        }
        font {
            text-align: center;
            color: black;
        }
        .card-front font {
            font-size: 4rem;
        }
    </style>
</head>
<body>
    <div class="card" onclick="flipCard(this)">
        <div class="card-inner">
            <div class="card-front">
                  <font>◯ △ ▢</font>
            </div>
            <div class="card-back">
              <font size="4">
                당신을 게임에 초대합니다.
                <br>
                <em>/OjinaGame</em>
              </font>
            </div>
        </div>
    </div>
    <script>
        function flipCard(card) {
            card.classList.toggle("flipped");
        }
    </script>
</body>
</html>
