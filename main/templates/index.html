<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSS Markdown Challenge</title>
</head>
<body>
    <h1>Markdown XSS Challenge</h1>
    <form method="POST">
        <textarea name="markdown" rows="10" cols="50" placeholder="Enter your markdown"></textarea>
        <br><br>
        <button type="submit">Render Markdown</button>
    </form>

    <h2>Rendered Output</h2>
    <div>
        <!-- 렌더링된 HTML 출력 -->
        {{ rendered_html|safe }}
    </div>
</body>
</html>
